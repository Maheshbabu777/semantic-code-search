services:

  backend-python:
    build:
      context: ./backend-python
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
      - chroma-data:/app/chroma_db
      - huggingface-cache:/root/.cache/huggingface
    env_file:
      - ./backend-python/.env
    environment:
      - CHROMA_PATH=/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "80:80"
    depends_on:
      - backend-python

volumes:
  chroma-data:
  huggingface-cache: